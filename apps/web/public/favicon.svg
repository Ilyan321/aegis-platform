<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Vignette Filter -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4965" />
      <stop offset="60%" stop-color="#0E2E4B" />
      <stop offset="100%" stop-color="#011936" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C0DFA1" />
      <stop offset="50%" stop-color="#9FC490" />
      <stop offset="100%" stop-color="#82A3A1" />
    </linearGradient>

    <!-- Edge Highlight Linear -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#9FC490" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#82A3A1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Facet Shadow -->
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Core Emblem -->
    <filter id="aegisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#9FC490" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Crisp 1px Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#011936" stroke="#82A3A1" stroke-width="2" />

  <!-- Background Radar Grid Elements -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#465362" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <circle cx="64" cy="64" r="28" fill="none" stroke="#82A3A1" stroke-width="1" stroke-opacity="0.3" />

  <!-- Outer Main Shield -->
  <path
    d="M64 16 L100 30 C100 72, 78 98, 64 108 C50 98, 28 72, 28 30 Z"
    fill="url(#shieldGrad)"
    stroke="url(#edgeGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#aegisGlow)"
  />

  <!-- Right Facet Shading for 3D Depth -->
  <path
    d="M64 16 L100 30 C100 72, 78 98, 64 108 Z"
    fill="url(#facetRight)"
  />

  <!-- Central Micro-Shield Aperture -->
  <path
    d="M64 34 L85 43 C85 68, 73 83, 64 90 C55 83, 43 68, 43 43 Z"
    fill="#000F24"
    stroke="#82A3A1"
    stroke-width="1.8"
    stroke-opacity="0.9"
  />

  <!-- Core Security Crystal / Sensor Lock Matrix -->
  <polygon points="64,44 74,56 64,68 54,56" fill="url(#coreGrad)" />
  <polygon points="64,68 71,76 64,84 57,76" fill="#9FC490" opacity="0.9" />
  <circle cx="64" cy="56" r="3.5" fill="#FFFFFF" />

  <!-- Tactical Hairline Crosshairs -->
  <line x1="64" y1="22" x2="64" y2="30" stroke="#C0DFA1" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="64" y1="94" x2="64" y2="102" stroke="#C0DFA1" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="34" y1="56" x2="40" y2="56" stroke="#9FC490" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <line x1="88" y1="56" x2="94" y2="56" stroke="#9FC490" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>

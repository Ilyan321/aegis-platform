services:
  - type: web
    name: aegis-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AEGIS_MASTER_KEY
        generateValue: true
      - key: AEGIS_BLIND_PEPPER
        generateValue: true
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://aegis-platform-web.vercel.app
      - key: BACKEND_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

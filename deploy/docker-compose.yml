version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aegis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: aegis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/aegis_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-to-a-secure-random-32-character-secret
      - AEGIS_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AEGIS_BLIND_PEPPER=local-dev-pepper-secret-key-32chars
      - WEBHOOK_SECRET_DEFAULT=aegis-default-webhook-secret
      - SLACK_WEBHOOK_URL=
      - ENVIRONMENT=development
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: aegis-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production

volumes:
  postgres_data:

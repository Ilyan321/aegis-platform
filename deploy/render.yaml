services:
  - type: web
    name: aegis-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AEGIS_MASTER_KEY
        generateValue: true
      - key: AEGIS_BLIND_PEPPER
        generateValue: true
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET_DEFAULT
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ENABLE_CELERY_WORKER
        value: "true"
      - key: CELERY_CONCURRENCY
        value: "1"

  # Optional Dedicated Background Worker Service for High-Throughput Scans
  - type: worker
    name: aegis-worker
    runtime: docker
    plan: free
    region: oregon
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=100
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AEGIS_MASTER_KEY
        sync: false
      - key: AEGIS_BLIND_PEPPER
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

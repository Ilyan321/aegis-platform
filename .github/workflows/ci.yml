name: Aegis CI / Verification Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  api-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
          AEGIS_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AEGIS_BLIND_PEPPER: test-pepper-salt-32chars-long!!
          WEBHOOK_SECRET_DEFAULT: test-default-webhook-secret
        run: |
          pytest apps/api/tests/ -v

  web-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/web
        run: npm install

      - name: Lint Next.js Codebase
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js Application
        working-directory: apps/web
        run: npm run build
